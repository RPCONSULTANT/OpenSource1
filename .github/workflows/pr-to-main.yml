name: PR to Main - Enforce Deploy and Validate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  enforce-deploy-source:
    name: Enforce source branch deploy
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if PR source is not deploy
        run: |
          if [ "${{ github.head_ref }}" != "deploy" ] && [ "${{ github.head_ref }}" != "Deploy" ]; then
            echo "Only PRs from 'deploy' to 'main' are allowed. Current source: '${{ github.head_ref }}'."
            exit 1
          fi

  validate:
    name: Restore, Build and Test
    if: ${{ !github.event.pull_request.draft }}
    needs: enforce-deploy-source
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$GITHUB_WORKSPACE/test.slnx"

      - name: Build
        run: dotnet build "$GITHUB_WORKSPACE/test.slnx" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$GITHUB_WORKSPACE/test.slnx" --configuration Release --no-build
