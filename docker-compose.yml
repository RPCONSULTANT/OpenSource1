services:
  blazor:
    build:
      context: .
      dockerfile: Dockerfile.blazor
    image: opensource1-blazor:local
    container_name: opensource1-blazor
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TestAppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__IdentityConnection: "Server=sqlserver,1433;Database=TestIdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: OpenSource1.Local
      Jwt__Audience: OpenSource1.Local
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-LocalDevelopmentSigningKey_ChangeMe_1234567890}"
      Jwt__ExpirationMinutes: 120
      Cors__AllowedOrigins__0: http://localhost:8080
      Api__BaseAddress: http://api:8080/
      Database__ApplyMigrationsOnStartup: "false"
    ports:
      - "8080:8080"
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_started
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: opensource1-api:local
    container_name: opensource1-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TestAppDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file};TrustServerCertificate=True;MultipleActiveResultSets=True"
      ConnectionStrings__IdentityConnection: "Server=sqlserver,1433;Database=TestIdentityDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: OpenSource1.Local
      Jwt__Audience: OpenSource1.Local
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-LocalDevelopmentSigningKey_ChangeMe_1234567890}"
      Jwt__ExpirationMinutes: 120
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://localhost:8081
      Database__ApplyMigrationsOnStartup: "true"
      UserSeed__Enabled: "true"
      UserSeed__DefaultPassword: "${AUTH_SEED_DEFAULT_PASSWORD:?Set AUTH_SEED_DEFAULT_PASSWORD in a local .env file}"
    ports:
      - "8081:8080"
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: test-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in a local .env file}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:
  dataprotection-keys:
